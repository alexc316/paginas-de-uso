<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Códigos QR</title>
    <!-- Librería para generar códigos QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: rgba(0, 0, 0, 0.75);
            --text-color: #ffffff;
            --primary-color: #0080ff;
            --secondary-color: #1a1a1a;
            --card-bg: rgba(255, 255, 255, 0.12);
        }
        [data-theme="dark"] {
            --bg-color: rgba(255, 255, 255, 0.88);
            --text-color: #1a1a1a;
            --primary-color: #1a1a1a;
            --secondary-color: #0080ff;
            --card-bg: rgba(0, 0, 0, 0.08);
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://i.pinimg.com/736x/6b/75/ac/6b75acb08c24c710590aaa4da15ac6ed.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-color);
            text-align: center;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .logo {
            font-size: 50px;
            margin: 15px 0 5px 0;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% {transform: translateY(0);}
            50% {transform: translateY(-8px);}
        }
        h1 {
            margin: 5px 0 15px 0;
            color: var(--text-color);
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
        }
        h1 span {
            color: #0080ff;
        }
        .container {
            background: var(--bg-color);
            margin: 20px auto;
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 650px;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 35px rgba(0,0,0,0.4);
            animation: fadeIn 0.8s ease;
        }
        .theme-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            background: var(--secondary-color);
            color: white;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 14px;
            cursor: pointer;
            z-index: 1000;
            border: 1px solid rgba(255,255,255,0.2);
        }
        /* PESTAÑAS DE TIPOS DE QR */
        .type-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .tab-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .tab-btn.active, .tab-btn:hover {
            background: #0080ff;
            color: white;
            border-color: #0080ff;
        }
        .input-group {
            margin: 12px 0;
            text-align: left;
        }
        .input-group label {
            font-size: 13px;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="tel"], textarea, select, input[type="color"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #555;
            background: rgba(0,0,0,0.3);
            color: white;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 70px;
        }
        .preset-colors {
            display: flex;
            gap: 8px;
            margin-top: 5px;
        }
        .preset-btn {
            flex: 1;
            padding: 6px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .row-grid {
            display: flex;
            gap: 12px;
        }
        .row-grid .input-group {
            flex: 1;
        }
        button.action-btn {
            background: linear-gradient(45deg, #0080ff, #004080);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 10px;
            margin: 15px 0 5px 0;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: transform 0.2s ease;
        }
        button.action-btn:hover {
            transform: scale(1.02);
        }
        #canvasPreviewContainer {
            margin: 20px auto;
            display: none;
            text-align: center;
        }
        #finalCanvas {
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            max-width: 100%;
        }
        #qrcodeHidden {
            display: none;
        }
        /* FIRMA INFERIOR IZQUIERDA */
        .footer-signature {
            text-align: left;
            padding: 15px 25px;
            font-size: 13px;
            font-weight: bold;
            color: var(--text-color);
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
        }
        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(15px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>
</head>
<body>

    <div class="theme-toggle" onclick="toggleTheme()">🌗 Tema</div>

    <div class="container">
        <div class="logo">📱✨</div>
        <h1><span>GENERADOR</span> QR PRO</h1>

        <!-- SELECCIÓN DE TIPO DE QR -->
        <div class="type-tabs">
            <button class="tab-btn active" onclick="cambiarTipo('url')">🌐 Web / Link</button>
            <button class="tab-btn" onclick="cambiarTipo('imagen')">🖼️ Imagen / Foto</button>
            <button class="tab-btn" onclick="cambiarTipo('ubicacion')">🗺️ Ubicación</button>
            <button class="tab-btn" onclick="cambiarTipo('texto')">📝 Información</button>
            <button class="tab-btn" onclick="cambiarTipo('contacto')">📞 Contacto</button>
            <button class="tab-btn" onclick="cambiarTipo('wifi')">📶 Red WiFi</button>
        </div>

        <!-- FORMULARIOS DINÁMICOS -->
        <div id="formContainer">
            <!-- Formulario URL/Link -->
            <div id="form-url" class="form-type">
                <div class="input-group">
                    <label>Enlace URL de la página web:</label>
                    <input type="text" id="urlInput" placeholder="https://ejemplo.com" oninput="generarQR()">
                </div>
            </div>

            <!-- Formulario Imagen -->
            <div id="form-imagen" class="form-type" style="display:none;">
                <div class="input-group">
                    <label>Link directo a la imagen o álbum (Drive, Google Photos, Pinterest, etc.):</label>
                    <input type="text" id="imgUrlInput" placeholder="https://i.pinimg.com/... o enlace de tu imagen" oninput="generarQR()">
                </div>
            </div>

            <!-- Formulario Ubicación -->
            <div id="form-ubicacion" class="form-type" style="display:none;">
                <div class="input-group">
                    <label>Enlace de Google Maps o Dirección:</label>
                    <input type="text" id="mapInput" placeholder="Ej: https://maps.google.com/?q=..." oninput="generarQR()">
                </div>
            </div>

            <!-- Formulario Texto / Información -->
            <div id="form-texto" class="form-type" style="display:none;">
                <div class="input-group">
                    <label>Información o texto largo:</label>
                    <textarea id="textInput" placeholder="Escribe aquí cualquier dato, nota o mensaje..." oninput="generarQR()"></textarea>
                </div>
            </div>

            <!-- Formulario Contacto -->
            <div id="form-contacto" class="form-type" style="display:none;">
                <div class="input-group">
                    <label>Número de teléfono:</label>
                    <input type="tel" id="phoneInput" placeholder="+52 123 456 7890" oninput="generarQR()">
                </div>
            </div>

            <!-- Formulario WiFi -->
            <div id="form-wifi" class="form-type" style="display:none;">
                <div class="row-grid">
                    <div class="input-group">
                        <label>Nombre de red (SSID):</label>
                        <input type="text" id="wifiSsid" placeholder="MiRedWiFi" oninput="generarQR()">
                    </div>
                    <div class="input-group">
                        <label>Contraseña:</label>
                        <input type="text" id="wifiPass" placeholder="Contraseña123" oninput="generarQR()">
                    </div>
                </div>
            </div>
        </div>

        <!-- OPCIONES DE DISEÑO Y COLOR -->
        <div class="row-grid">
            <div class="input-group">
                <label>Color del QR:</label>
                <input type="color" id="colorDark" value="#000000" onchange="generarQR()">
                <div class="preset-colors">
                    <button class="preset-btn" style="background:#000000;" onclick="setColor('#000000')">Negro</button>
                    <button class="preset-btn" style="background:#cc0000;" onclick="setColor('#cc0000')">Rojo</button>
                    <button class="preset-btn" style="background:#0066cc;" onclick="setColor('#0066cc')">Azul</button>
                </div>
            </div>
            <div class="input-group">
                <label>Color Fondo del QR:</label>
                <input type="color" id="colorLight" value="#ffffff" onchange="generarQR()">
            </div>
        </div>

        <!-- TEXTO ARRIBA Y ABAJO -->
        <div class="row-grid">
            <div class="input-group">
                <label>Texto Arriba (Opcional):</label>
                <input type="text" id="textoArriba" placeholder="Ej: ¡Escanéame!" oninput="generarQR()">
            </div>
            <div class="input-group">
                <label>Texto Abajo (Opcional):</label>
                <input type="text" id="textoAbajo" placeholder="Ej: Mi Página Web" oninput="generarQR()">
            </div>
        </div>

        <!-- Opciones de Color del Texto personalizado -->
        <div class="input-group">
            <label>Color del Texto Personalizado:</label>
            <input type="color" id="colorTexto" value="#000000" onchange="generarQR()">
        </div>

        <button class="action-btn" onclick="generarQR()">Actualizar / Renderizar QR</button>

        <!-- PREVISUALIZACIÓN Y DESCARGA -->
        <div id="canvasPreviewContainer">
            <canvas id="finalCanvas"></canvas>
            <button class="action-btn" onclick="descargarQR()" style="background: linear-gradient(45deg, #00b300, #006600);">📥 Descargar Código QR (PNG)</button>
        </div>

        <!-- Contenedor oculto para la librería inicial -->
        <div id="qrcodeHidden"></div>
    </div>

    <!-- PIE DE PÁGINA (ESQUINA INFERIOR IZQUIERDA) -->
    <div class="footer-signature">
        Hecho por a123alex
    </div>

    <script>
        let tipoActual = 'url';

        function toggleTheme() {
            const body = document.body;
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
            } else {
                body.setAttribute('data-theme', 'dark');
            }
        }

        function cambiarTipo(tipo) {
            tipoActual = tipo;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            document.querySelectorAll('.form-type').forEach(form => form.style.display = 'none');
            document.getElementById(`form-${tipo}`).style.display = 'block';

            generarQR();
        }

        function setColor(hex) {
            document.getElementById('colorDark').value = hex;
            generarQR();
        }

        function obtenerTextoData() {
            switch(tipoActual) {
                case 'url':
                    return document.getElementById('urlInput').value.trim();
                case 'imagen':
                    return document.getElementById('imgUrlInput').value.trim();
                case 'ubicacion':
                    return document.getElementById('mapInput').value.trim();
                case 'texto':
                    return document.getElementById('textInput').value.trim();
                case 'contacto':
                    const tel = document.getElementById('phoneInput').value.trim();
                    return tel ? `TEL:${tel}` : '';
                case 'wifi':
                    const ssid = document.getElementById('wifiSsid').value.trim();
                    const pass = document.getElementById('wifiPass').value.trim();
                    return ssid ? `WIFI:S:${ssid};T:WPA;P:${pass};;` : '';
                default:
                    return '';
            }
        }

        function generarQR() {
            const dataText = obtenerTextoData();
            const container = document.getElementById('canvasPreviewContainer');
            const qrcodeHidden = document.getElementById('qrcodeHidden');

            if (!dataText) {
                container.style.display = 'none';
                qrcodeHidden.innerHTML = '';
                return;
            }

            qrcodeHidden.innerHTML = '';

            const colorDark = document.getElementById('colorDark').value;
            const colorLight = document.getElementById('colorLight').value;

            new QRCode(qrcodeHidden, {
                text: dataText,
                width: 220,
                height: 220,
                colorDark: colorDark,
                colorLight: colorLight,
                correctLevel: QRCode.CorrectLevel.H
            });

            // Esperar a que la imagen base64 se genere en el DOM
            setTimeout(() => {
                const img = qrcodeHidden.querySelector('img');
                if (img) {
                    dibujarCanvasFinal(img);
                }
            }, 50);
        }

        function dibujarCanvasFinal(qrImg) {
            const canvas = document.getElementById('finalCanvas');
            const ctx = canvas.getContext('2d');

            const txtArriba = document.getElementById('textoArriba').value.trim();
            const txtAbajo = document.getElementById('textoAbajo').value.trim();
            const colorTexto = document.getElementById('colorTexto').value;
            const colorFondo = document.getElementById('colorLight').value;

            const qrSize = 220;
            const padding = 20;
            const textHeight = 30;

            let extraTop = txtArriba ? textHeight : 0;
            let extraBottom = txtAbajo ? textHeight : 0;

            canvas.width = qrSize + (padding * 2);
            canvas.height = qrSize + (padding * 2) + extraTop + extraBottom;

            // Rellenar Fondo
            ctx.fillStyle = colorFondo;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dibujar QR
            ctx.drawImage(qrImg, padding, padding + extraTop, qrSize, qrSize);

            // Estilo de Texto
            ctx.fillStyle = colorTexto;
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';

            // Dibujar Texto Arriba
            if (txtArriba) {
                ctx.fillText(txtArriba, canvas.width / 2, padding + 18);
            }

            // Dibujar Texto Abajo
            if (txtAbajo) {
                ctx.fillText(txtAbajo, canvas.width / 2, canvas.height - padding + 5);
            }

            document.getElementById('canvasPreviewContainer').style.display = 'block';
        }

        function descargarQR() {
            const canvas = document.getElementById('finalCanvas');
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'qr.png';
            link.click();
        }
    </script>
</body>
</html>
